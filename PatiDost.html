    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

        }

<body>

    <div id="AnaDiv">
        <nav class="navbar shadow-sm border-bottom" style="height: 80px;">
            <div class="container-fluid">
                <div>
                    <h3 style="margin-left: 200px; "><span style="font-size: 35px;">🐾 </span>PatiDost <span

                            Klinik Sistemi Uygulaması</span>
                    </h3>
                </div>
                <div class="d-none d-sm-block"
                    style="color: rgba(116, 130, 151);font-weight:normal;letter-spacing: 0.3px;font-size:20px;margin-right: 200px;">
                    EF Core Code First • .NET 8 API • Bootstrap 5
                </div>



            </div>
        </nav>
        <br>
        <div class="container-xl ">
            <div class="container-lg d-flex align-items-center "

                    <h3 class="mb-0" style="color: rgba(30, 41, 59);">

                    </h3>

                    <button class="btn btn-success" onclick="openNewPatientModal()">Yeni Hasta</button>

                </div>

                <hr class="mt-1 mx-4">
                <div class="container-lg mt-4 mb-2 px-5">

                    </div>
                </div>



            </div>


















        </div>

            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body" id="modalBody">

                    </div>
